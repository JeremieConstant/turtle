<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <!-- The browser may paint before the stylesheet arrives; this keeps that moment in the system's appearance. -->
    <meta name="color-scheme" content="light dark" />
    <title>Turtle</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <script>
      // The appearance chosen in this browser applies before the first paint,
      // so the other one never flashes. appearance.svelte.ts keeps the choice.
      try {
        const choice = localStorage.getItem('turtle-appearance')
        if (choice === 'light' || choice === 'dark') document.documentElement.dataset.appearance = choice
      } catch {
        // Without storage the system decides.
      }
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>

# What `cargo deny check` allows in the server's dependency tree. The Deny
# workflow runs it on dependency changes and weekly, since a new advisory can
# make an unchanged lockfile fail. Run it by hand with `cargo deny check` from
# `server/` after `cargo install cargo-deny` (or `brew install cargo-deny`).

[graph]
all-features = true

[advisories]
# Every advisory in the RustSec database fails the check, as do yanked crates.
# Silence one only with its ID in `ignore` and the reason beside it.
yanked = "deny"
ignore = [
    # quick-xml 0.38 comes in through typst → hayagriva → citationberg, which
    # pins it; the fix is in 0.41. citationberg parses CSL citation styles,
    # which only `bibliography` and `cite` read, and the PDF layout uses
    # neither: a Page reaches Typst only as JSON data (src/pdf/mod.rs). Drop
    # these once a typst release moves past quick-xml 0.38.
    { id = "RUSTSEC-2026-0194", reason = "quick-xml via citationberg; Turtle never parses CSL" },
    { id = "RUSTSEC-2026-0195", reason = "quick-xml via citationberg; Turtle never parses CSL" },
]

[licenses]
# Licenses Turtle, as AGPL-3.0-only, can ship. A new dependency under another
# license fails the check. Add it here only once it is known to be compatible.
allow = [
    "0BSD",
    "AGPL-3.0-only",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",
    "ISC",
    "MIT",
    "Unicode-3.0",
    "Zlib",
]
confidence-threshold = 0.9

[bans]
# Two versions of one crate are common in a tree this size: reported, not fatal.
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"

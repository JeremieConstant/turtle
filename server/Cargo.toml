[package]
name = "turtle"
version = "0.1.0"
edition = "2021"
license = "AGPL-3.0-only"

[dependencies]
anyhow = "1.0.104"
argon2 = "0.6.0"
base64 = "0.22.1"
axum = { version = "0.8.9", features = ["ws"] }
futures-util = "0.3.34"
getrandom = "0.4.3"
# Invitations and password reset links are mailed over SMTP when it is set
# up. Blocking, since operations run off the async workers; rustls, so no
# system TLS library is needed.
lettre = { version = "0.11.24", default-features = false, features = ["smtp-transport", "builder", "hostname", "rustls-tls"] }
# Profile pictures are decoded, cropped and scaled down. The formats a Page
# shows as images, nothing more.
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
pulldown-cmark = "0.13.6"
rusqlite = { version = "0.43.0", features = ["bundled"] }
schemars = "1.2.3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sha2 = "0.11.1"
tantivy = "0.27.0"
tokio = { version = "1.54.1", features = ["full"] }
# The WebSocket library axum uses, named to recognise how a connection ended.
# Keep it at axum's version: with a second copy the errors stop matching.
tungstenite = "0.29.0"
yrs = "0.28.2"
zip = { version = "9.8.2", default-features = false, features = ["deflate-flate2-zlib-rs"] }
typst = "0.15.1"
typst-pdf = "0.15.1"
typst-layout = "0.15.1"

[dev-dependencies]
pdf-extract = "0.12.1"
tempfile = "3.27.0"
tokio-tungstenite = "0.30.0"
tower = { version = "0.5.3", features = ["util"] }

[lints.clippy]
# An async block holding a large value, such as a buffer, makes every future
# that awaits it that large, until a test's stack overflows far from the
# cause. This names the line instead.
large_futures = "warn"

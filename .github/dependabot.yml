# Keeps dependencies current with a few grouped pull requests a week. Each one
# runs the Check workflow like any other. A release must be a week old before
# it is proposed, so a broken or compromised one is usually pulled by then.
# Security updates are not delayed: they come from the repository's
# Dependabot security updates setting, apart from this schedule.
version: 2
updates:
  - package-ecosystem: cargo
    directory: /server
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      rust-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # axum's WebSocket library, kept at axum's version (see Cargo.toml): a
      # second copy compiles and passes the tests, but its errors stop
      # matching. These move by hand when axum moves.
      - dependency-name: tungstenite
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: tokio-tungstenite
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    open-pull-requests-limit: 3
    groups:
      # Tiptap's packages and the Yjs ones it builds on move together.
      editor:
        patterns: ["@tiptap/*", "yjs", "y-*"]
      web-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # A new TypeScript major waits until svelte-check accepts it as a peer.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      # Node moves by hand from one LTS major to the next, together with
      # node-version in .github/workflows/check.yml, which Dependabot would
      # leave behind.
      - dependency-name: library/node
        update-types: ["version-update:semver-major"]

name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: server
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm --prefix web ci
      - run: scripts/check.sh

  # Every commit a pull request adds is signed off by its author; see
  # CONTRIBUTING.md. Commits already on the base branch are not checked.
  # Dependabot cannot sign off, so on its own pull requests its commits are
  # left out; a commit someone else pushes there is still checked.
  sign-off:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - run: scripts/check-sign-off.sh "origin/$GITHUB_BASE_REF" HEAD
        env:
          SIGN_OFF_EXEMPT_AUTHOR: ${{ github.event.pull_request.user.login == 'dependabot[bot]' && 'dependabot[bot] <49699333+dependabot[bot]@users.noreply.github.com>' || '' }}
